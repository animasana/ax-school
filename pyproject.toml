[project]
name = "openai-agents-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "animasana", email = "animagig@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "openai>=3.40.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
openai-agents-api = "openai_agents_api:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
]
